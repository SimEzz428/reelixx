services:
  - type: web
    name: reelixx-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: REELIXX_FREE_MODE
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      # Comma-separated frontend origins, e.g. https://reelixx.vercel.app
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: reelixx-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NEXT_PUBLIC_API_BASE
        fromService:
          type: web
          name: reelixx-backend
          property: host
